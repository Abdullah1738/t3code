# offbox home server: nobody is at the console.
GRUB_DEFAULT=saved
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=3
GRUB_DISABLE_OS_PROBER=true
GRUB_DISABLE_SUBMENU=true
GRUB_TERMINAL=console
GRUB_CMDLINE_LINUX_DEFAULT=""
# panic=10: a panic, and an initramfs that cannot find the root disk, restart after 10 s instead of waiting.
# fsck.repair=yes: file system checks repair without asking.
GRUB_CMDLINE_LINUX="console=ttyS0,115200n8 console=tty0 panic=10 fsck.repair=yes"
