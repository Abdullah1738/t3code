# offbox: never restart the services runs depend on from apt; the board picks them up in a planned window.
$nrconf{override_rc}{qr(^incus)} = 0;      # incus.service/.socket, incus-lxcfs, incus-user
$nrconf{override_rc}{qr(^lxcfs)} = 0;
$nrconf{override_rc}{qr(^boatd)} = 0;      # boatd.service and every boatd-cmd-* unit
$nrconf{override_rc}{qr(^zfs)} = 0;
$nrconf{override_rc}{qr(^mullvad)} = 0;    # the VPN carries every box's internet connection
$nrconf{override_rc}{qr(^offbox-)} = 0;     # the exit proxy, VPN guards and host helpers must keep running
