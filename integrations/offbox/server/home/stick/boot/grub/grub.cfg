# offbox home server: headless installer stick. Replaces the Ubuntu ISO's grub.cfg.
#
# Nobody is at a keyboard, so this file decides by itself:
#   internal disks hold a finished offbox install, no marker file  -> boot that install from the disks
#   anything else (blank disks, interrupted install, marker file)  -> start the zero-touch installer
# The installer has its own second guard (offbox/installer/plan.py) and refuses to wipe a finished install.
# Marker files (WIPE-EVERYTHING, REINSTALL-OS) may sit in the root of either stick volume.

set timeout=5
set timeout_style=menu
set fallback="next"
set pager=0

loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

set offbox_marker=0
for f in WIPE-EVERYTHING REINSTALL-OS WIPE-EVERYTHING.txt REINSTALL-OS.txt; do
    if [ -e "($root)/$f" ]; then set offbox_marker=1; fi
done
set offbox_log=
if search --no-floppy --file --set=offbox_log /OFFBOX-LOG-VOLUME; then
    for f in WIPE-EVERYTHING REINSTALL-OS WIPE-EVERYTHING.txt REINSTALL-OS.txt; do
        if [ -e "($offbox_log)/$f" ]; then set offbox_marker=1; fi
    done
fi

set offbox_installed=0
set offbox_osesp=
if search --no-floppy --file --set=offbox_osesp /EFI/offbox/installed; then
    set offbox_installed=1
fi

if [ "$offbox_installed" = 1 -a "$offbox_marker" = 0 ]; then
    set default=disk
    set offbox_why=installed-system-found
else
    set default=install
    if [ "$offbox_marker" = 1 ]; then
        set offbox_why=marker-file
    else
        set offbox_why=no-finished-install
    fi
fi
echo "offbox: installed=$offbox_installed marker=$offbox_marker -> $default ($offbox_why)"

menuentry "offbox: install Ubuntu Server on the internal disks (zero-touch)" --id install {
    set gfxpayload=keep
    echo "offbox: loading the installer ($offbox_why) ..."
    linux /casper/hwe-vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ hostname=offbox-installer noprompt console=ttyS0,115200n8 console=tty0 offbox.why=$offbox_why ---
    initrd /casper/hwe-initrd
}
menuentry "offbox: boot the installed system from the internal disks" --id disk {
    echo "offbox: booting the installed system from the internal disks ..."
    # 1. Run the installed system's own GRUB configuration with this GRUB. Nothing is handed back to the
    #    firmware, so it works whatever the firmware's boot entries look like. The ESP's grub.cfg finds /boot
    #    by UUID and loads the real menu (saved default kernel, one-shot kernel trial). This GRUB has no RAID
    #    support built in; /boot is a RAID1 with its superblock at the end, so one member reads as plain ext4.
    for d in $offbox_osesp hd0,gpt1 hd1,gpt1 hd2,gpt1 hd3,gpt1 hd4,gpt1 hd5,gpt1; do
        if [ -e "($d)/EFI/offbox/installed" -a -e "($d)/EFI/ubuntu/grub.cfg" ]; then
            echo "offbox: loading the installed system's boot menu from ($d)"
            configfile "($d)/EFI/ubuntu/grub.cfg"
            echo "offbox: the boot menu on ($d) did not start a system"
        fi
    done
    # 2. Fallback: start the boot loader on the disk as a new EFI program.
    for d in $offbox_osesp hd0,gpt1 hd1,gpt1 hd2,gpt1 hd3,gpt1 hd4,gpt1 hd5,gpt1; do
        if [ -e "($d)/EFI/offbox/installed" ]; then
            for l in /EFI/ubuntu/shimx64.efi /EFI/BOOT/BOOTX64.EFI /EFI/ubuntu/grubx64.efi; do
                if [ -e "($d)$l" ]; then
                    echo "offbox: chainloading ($d)$l"
                    chainloader "($d)$l"
                    boot
                fi
            done
        fi
    done
    echo "offbox: no bootable install found, handing back to the firmware"
    exit 1
}
menuentry "Boot from next volume" --id next {
    exit 1
}
menuentry "UEFI Firmware Settings" --id fwsetup {
    fwsetup
}
