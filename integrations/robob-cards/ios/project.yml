name: RobobCards
options:
  bundleIdPrefix: com.abdullah.robob
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: HVG39427R3
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Xcode on this Mac has no Apple ID, so automatic signing cannot mint
    # profiles. The cached wildcard development profile covers both bundle ids
    # because neither target asks for entitlements.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: "Abdullah Dev Wildcard (iPhone + iPad)"
targets:
  RobobCards:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: RobobCardsMessages
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullah.robob.cards
        PRODUCT_NAME: RobobCards
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RobobCardsMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
    dependencies:
      - sdk: Messages.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullah.robob.cards.MessagesExtension
        PRODUCT_NAME: RobobCardsMessages
        INFOPLIST_FILE: Messages/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
